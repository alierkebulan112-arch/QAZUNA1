# Render Blueprint: статикалық сайт (Vite → dist)
services:
  - type: web
    name: qazyna
    runtime: static
    buildCommand: npx --yes pnpm@10 install --frozen-lockfile && npx --yes pnpm@10 run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
